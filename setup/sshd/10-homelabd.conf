# Keep ordinary per-user keys and ask the restricted homelabd account for
# keys reconciled from Stigmergy. This loads before 20-systemd-userdb.conf;
# the helper preserves that provider's keys as well.
AuthorizedKeysFile .ssh/authorized_keys
AuthorizedKeysCommand /usr/local/libexec/homelabd-authorized-keys %u
AuthorizedKeysCommandUser homelabd
